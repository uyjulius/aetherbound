# Build the game and publish it to GitHub Pages.
#
# The dev server mounts two directories — public/ at the root and assets/ at
# /assets/ — so the deployed site has to be assembled the same way rather than
# pointing Pages at a single folder.
#
# Textures and character models are committed, so this does not regenerate art:
# `npm run textures:raw` needs network access and an image model, and the
# quilted plates are deterministic given their sources anyway.
#
# Two builds ship from one commit. The JS game is the product and holds the root.
# The Godot port is published to /godot/ by a separate job that must pass its own
# browser check — and if it does not, the site still deploys without it. The live
# game does not go down because a port-in-progress broke, and a preview that
# failed its check is absent rather than quietly stale.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The editor and its export templates have to be the same build, or the export
  # fails with a version mismatch that reads like a corrupt download.
  GODOT_VERSION: 4.7.1-stable
  GODOT_TEMPLATES: 4.7.1.stable

jobs:
  # ---------------------------------------------------------------------------
  # The Godot port: export for the browser, then prove the export boots. Neither
  # step is optional — a Godot export succeeds and exits zero while producing a
  # pack with no resources in it, and that failure only shows up as a black
  # canvas in a browser.
  # ---------------------------------------------------------------------------
  godot:
    name: Export and check the Godot build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      # The editor is 144MB and the official template bundle is 1.2GB, for a
      # version that changes a few times a year. The cache holds the editor and
      # only the web template extracted from that bundle — about 155MB — so a
      # normal run downloads nothing.
      - name: Cache Godot ${{ env.GODOT_VERSION }}
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-web-${{ env.GODOT_VERSION }}

      - name: Fetch Godot and the web export template
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES}"
          mkdir -p ~/godot "$templates"

          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

          # `.tpz` carries every platform — Android alone is 450MB — and the web
          # export needs one 10MB file out of it. Only that and `version.txt`
          # (which is how Godot recognises the directory as a template set) are
          # kept, which is what keeps the cache small. A `--export-debug` run
          # would want `web_nothreads_debug.zip` as well and will say so plainly.
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q -o /tmp/templates.tpz \
            'templates/web_nothreads_release.zip' 'templates/version.txt' -d /tmp/templates
          mv /tmp/templates/templates/* "$templates/"
          rm -rf /tmp/templates.tpz /tmp/templates /tmp/godot.zip
          du -sh ~/godot "$templates"

      # Importing first, explicitly. The export triggers an import when the cache
      # is missing — which it always is on a fresh checkout, since godot/.godot is
      # not committed — and doing it in its own step means an import failure is
      # reported as an import failure.
      - name: Import the project
        run: ~/godot/godot --headless --path godot --import

      # Before the parity suite, not after: audio parity re-renders part of the
      # score through the reference's own Web Audio engine to prove the shipped
      # files are still that score, and it needs a page to do it in.
      # Cached, and deliberately without `--with-deps`. The apt half of that flag sat
      # for half an hour on two runners in a row while finding every library already
      # installed — the ubuntu-latest image ships them — so it buys nothing here and
      # costs the whole job when a mirror stops answering. If a future image drops a
      # library, the browser check below fails loudly at launch rather than silently.
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the browser
        timeout-minutes: 8
        run: npx playwright install chromium

      # The parity suite is the port's entire guarantee — 3,804 formula values,
      # 40,855 table numbers, 24,000 AI decisions, 1,719 RNG draws, 897 glue
      # values, five save files and the whole rendered score against the
      # reference build. It runs before the export, because a build that
      # disagrees with the game it is porting should not be published however
      # well it boots.
      - name: Check the port against the reference
        run: GODOT=~/godot/godot npm run port

      - name: Export for the browser
        run: GODOT=~/godot/godot npm run export:web

      # Longer than the local default: compiling 40MB of wasm under a software
      # rasteriser on a shared runner is slow, and a timeout failure here would
      # be indistinguishable from a build that cannot start.
      - name: Prove the export boots
        run: npm run smoke:web -- --timeout 420

      - uses: actions/upload-artifact@v4
        with:
          name: godot-web
          path: build/web
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-web-screenshot
          path: .renders/godot-web-title.png
          retention-days: 7

  build:
    needs: [godot]
    # The port must not be able to take the live game down with it.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Build the bundle
        run: npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r public/. _site/
          mkdir -p _site/assets
          # Only what the game loads at runtime. The raw generator inputs are
          # not in the repo and the contact sheets are documentation.
          cp -r assets/textures _site/assets/
          cp -r assets/models _site/assets/
          cp -r assets/monsters _site/assets/
          rm -f _site/game.js.map
          echo 'aetherbound.uy.sg' > _site/CNAME
          du -sh _site

      # A missing asset directory does not fail the build, it just ships a
      # game with no monsters in it — which is exactly what happened when the
      # bestiary's models were added and this list was not. Fail loudly here
      # instead of finding out from a screenshot.
      - name: Check the runtime assets are present
        run: |
          for dir in textures models monsters; do
            count=$(find "_site/assets/$dir" -type f | wc -l)
            echo "assets/$dir: $count files"
            [ "$count" -gt 0 ] || { echo "::error::_site/assets/$dir is empty"; exit 1; }
          done
          # Every model the loaders name has to actually be there.
          missing=0
          for id in $(grep -oE "id: '[A-Za-z0-9_-]+'" src/battle/monstermodels.js | cut -d"'" -f2); do
            [ -f "_site/assets/monsters/$id.glb" ] || { echo "::error::missing monster $id"; missing=1; }
          done
          for f in $(grep -oE "file: '[A-Za-z0-9_-]+\.glb'" src/world/charmodels.js | cut -d"'" -f2); do
            [ -f "_site/assets/models/$f" ] || { echo "::error::missing character model $f"; missing=1; }
          done
          exit $missing

      - name: Add the Godot preview
        if: needs.godot.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: godot-web
          path: _site/godot

      # Said out loud either way. A preview that silently stops appearing is
      # worse than one that is loudly missing.
      - name: Report what is shipping
        run: |
          if [ -f _site/godot/index.html ]; then
            echo "Godot preview: publishing $(du -sh _site/godot | cut -f1) to /godot/"
          else
            echo "::warning::Godot preview NOT shipping — the export or its browser check failed (job result: ${{ needs.godot.result }})"
          fi
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
